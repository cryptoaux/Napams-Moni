name: NAPAMS Monitor

# Live monitoring path.
# This workflow is intentionally separate from CI validation and performs
# the real NAPAMS network login/status checks against the production site.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: napams-monitor-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live-monitor:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies with the lockfile
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: NAPAMS connectivity test
        run: |
          echo "========================================"
          echo "NAPAMS CONNECTIVITY TEST"
          echo "========================================"

          echo ""
          echo "Testing HTTP/1.1..."

          curl --http1.1 -v --max-time 180 \
            https://registration.nafdac.gov.ng/Applicant/Login \
            -o /tmp/napams-http11.html

          HTTP11_EXIT=$?

          echo "HTTP/1.1 exit code: $HTTP11_EXIT"
          echo "HTTP/1.1 response size:"
          wc -c /tmp/napams-http11.html 2>/dev/null || true

          echo ""
          echo "Testing HTTP/2..."

          curl --http2 -v --max-time 180 \
            https://registration.nafdac.gov.ng/Applicant/Login \
            -o /tmp/napams-http2.html

          HTTP2_EXIT=$?

          echo "HTTP/2 exit code: $HTTP2_EXIT"
          echo "HTTP/2 response size:"
          wc -c /tmp/napams-http2.html 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "CONNECTIVITY TEST COMPLETE"
          echo "HTTP/1.1 exit: $HTTP11_EXIT"
          echo "HTTP/2 exit: $HTTP2_EXIT"
          echo "========================================"

      - name: Validate live company credentials
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const companies = JSON.parse(fs.readFileSync('companies.json', 'utf8'));
          const missing = [];

          for (const company of companies) {
            const tin = process.env[company.tinSecret];
            const password = process.env[company.passwordSecret];

            if (!tin || !password) {
              missing.push(company.id);
            }
          }

          if (missing.length > 0) {
            throw new Error(`Missing credentials for companies: ${missing.join(', ')}`);
          }

          console.log(`Validated ${companies.length} company credential env vars.`);
          NODE
        env:
          COMPANY_1_TIN: ${{ secrets.COMPANY_1_TIN }}
          COMPANY_1_PASSWORD: ${{ secrets.COMPANY_1_PASSWORD }}
          COMPANY_2_TIN: ${{ secrets.COMPANY_2_TIN }}
          COMPANY_2_PASSWORD: ${{ secrets.COMPANY_2_PASSWORD }}
          COMPANY_3_TIN: ${{ secrets.COMPANY_3_TIN }}
          COMPANY_3_PASSWORD: ${{ secrets.COMPANY_3_PASSWORD }}
          COMPANY_4_TIN: ${{ secrets.COMPANY_4_TIN }}
          COMPANY_4_PASSWORD: ${{ secrets.COMPANY_4_PASSWORD }}
          COMPANY_5_TIN: ${{ secrets.COMPANY_5_TIN }}
          COMPANY_5_PASSWORD: ${{ secrets.COMPANY_5_PASSWORD }}
          COMPANY_6_TIN: ${{ secrets.COMPANY_6_TIN }}
          COMPANY_6_PASSWORD: ${{ secrets.COMPANY_6_PASSWORD }}
          COMPANY_7_TIN: ${{ secrets.COMPANY_7_TIN }}
          COMPANY_7_PASSWORD: ${{ secrets.COMPANY_7_PASSWORD }}
          COMPANY_8_TIN: ${{ secrets.COMPANY_8_TIN }}
          COMPANY_8_PASSWORD: ${{ secrets.COMPANY_8_PASSWORD }}
          COMPANY_9_TIN: ${{ secrets.COMPANY_9_TIN }}
          COMPANY_9_PASSWORD: ${{ secrets.COMPANY_9_PASSWORD }}
          COMPANY_10_TIN: ${{ secrets.COMPANY_10_TIN }}
          COMPANY_10_PASSWORD: ${{ secrets.COMPANY_10_PASSWORD }}
          COMPANY_11_TIN: ${{ secrets.COMPANY_11_TIN }}
          COMPANY_11_PASSWORD: ${{ secrets.COMPANY_11_PASSWORD }}
          COMPANY_12_TIN: ${{ secrets.COMPANY_12_TIN }}
          COMPANY_12_PASSWORD: ${{ secrets.COMPANY_12_PASSWORD }}
          COMPANY_13_TIN: ${{ secrets.COMPANY_13_TIN }}
          COMPANY_13_PASSWORD: ${{ secrets.COMPANY_13_PASSWORD }}
          COMPANY_14_TIN: ${{ secrets.COMPANY_14_TIN }}
          COMPANY_14_PASSWORD: ${{ secrets.COMPANY_14_PASSWORD }}
          COMPANY_15_TIN: ${{ secrets.COMPANY_15_TIN }}
          COMPANY_15_PASSWORD: ${{ secrets.COMPANY_15_PASSWORD }}
          COMPANY_16_TIN: ${{ secrets.COMPANY_16_TIN }}
          COMPANY_16_PASSWORD: ${{ secrets.COMPANY_16_PASSWORD }}
          COMPANY_17_TIN: ${{ secrets.COMPANY_17_TIN }}
          COMPANY_17_PASSWORD: ${{ secrets.COMPANY_17_PASSWORD }}
          COMPANY_18_TIN: ${{ secrets.COMPANY_18_TIN }}
          COMPANY_18_PASSWORD: ${{ secrets.COMPANY_18_PASSWORD }}
          COMPANY_19_TIN: ${{ secrets.COMPANY_19_TIN }}
          COMPANY_19_PASSWORD: ${{ secrets.COMPANY_19_PASSWORD }}
          COMPANY_20_TIN: ${{ secrets.COMPANY_20_TIN }}
          COMPANY_20_PASSWORD: ${{ secrets.COMPANY_20_PASSWORD }}
          COMPANY_21_TIN: ${{ secrets.COMPANY_21_TIN }}
          COMPANY_21_PASSWORD: ${{ secrets.COMPANY_21_PASSWORD }}
          COMPANY_22_TIN: ${{ secrets.COMPANY_22_TIN }}
          COMPANY_22_PASSWORD: ${{ secrets.COMPANY_22_PASSWORD }}
          COMPANY_23_TIN: ${{ secrets.COMPANY_23_TIN }}
          COMPANY_23_PASSWORD: ${{ secrets.COMPANY_23_PASSWORD }}
          COMPANY_24_TIN: ${{ secrets.COMPANY_24_TIN }}
          COMPANY_24_PASSWORD: ${{ secrets.COMPANY_24_PASSWORD }}

      - name: Run NAPAMS monitor
        run: npm run monitor
        env:
          COMPANY_1_TIN: ${{ secrets.COMPANY_1_TIN }}
          COMPANY_1_PASSWORD: ${{ secrets.COMPANY_1_PASSWORD }}
          COMPANY_2_TIN: ${{ secrets.COMPANY_2_TIN }}
          COMPANY_2_PASSWORD: ${{ secrets.COMPANY_2_PASSWORD }}
          COMPANY_3_TIN: ${{ secrets.COMPANY_3_TIN }}
          COMPANY_3_PASSWORD: ${{ secrets.COMPANY_3_PASSWORD }}
          COMPANY_4_TIN: ${{ secrets.COMPANY_4_TIN }}
          COMPANY_4_PASSWORD: ${{ secrets.COMPANY_4_PASSWORD }}
          COMPANY_5_TIN: ${{ secrets.COMPANY_5_TIN }}
          COMPANY_5_PASSWORD: ${{ secrets.COMPANY_5_PASSWORD }}
          COMPANY_6_TIN: ${{ secrets.COMPANY_6_TIN }}
          COMPANY_6_PASSWORD: ${{ secrets.COMPANY_6_PASSWORD }}
          COMPANY_7_TIN: ${{ secrets.COMPANY_7_TIN }}
          COMPANY_7_PASSWORD: ${{ secrets.COMPANY_7_PASSWORD }}
          COMPANY_8_TIN: ${{ secrets.COMPANY_8_TIN }}
          COMPANY_8_PASSWORD: ${{ secrets.COMPANY_8_PASSWORD }}
          COMPANY_9_TIN: ${{ secrets.COMPANY_9_TIN }}
          COMPANY_9_PASSWORD: ${{ secrets.COMPANY_9_PASSWORD }}
          COMPANY_10_TIN: ${{ secrets.COMPANY_10_TIN }}
          COMPANY_10_PASSWORD: ${{ secrets.COMPANY_10_PASSWORD }}
          COMPANY_11_TIN: ${{ secrets.COMPANY_11_TIN }}
          COMPANY_11_PASSWORD: ${{ secrets.COMPANY_11_PASSWORD }}
          COMPANY_12_TIN: ${{ secrets.COMPANY_12_TIN }}
          COMPANY_12_PASSWORD: ${{ secrets.COMPANY_12_PASSWORD }}
          COMPANY_13_TIN: ${{ secrets.COMPANY_13_TIN }}
          COMPANY_13_PASSWORD: ${{ secrets.COMPANY_13_PASSWORD }}
          COMPANY_14_TIN: ${{ secrets.COMPANY_14_TIN }}
          COMPANY_14_PASSWORD: ${{ secrets.COMPANY_14_PASSWORD }}
          COMPANY_15_TIN: ${{ secrets.COMPANY_15_TIN }}
          COMPANY_15_PASSWORD: ${{ secrets.COMPANY_15_PASSWORD }}
          COMPANY_16_TIN: ${{ secrets.COMPANY_16_TIN }}
          COMPANY_16_PASSWORD: ${{ secrets.COMPANY_16_PASSWORD }}
          COMPANY_17_TIN: ${{ secrets.COMPANY_17_TIN }}
          COMPANY_17_PASSWORD: ${{ secrets.COMPANY_17_PASSWORD }}
          COMPANY_18_TIN: ${{ secrets.COMPANY_18_TIN }}
          COMPANY_18_PASSWORD: ${{ secrets.COMPANY_18_PASSWORD }}
          COMPANY_19_TIN: ${{ secrets.COMPANY_19_TIN }}
          COMPANY_19_PASSWORD: ${{ secrets.COMPANY_19_PASSWORD }}
          COMPANY_20_TIN: ${{ secrets.COMPANY_20_TIN }}
          COMPANY_20_PASSWORD: ${{ secrets.COMPANY_20_PASSWORD }}
          COMPANY_21_TIN: ${{ secrets.COMPANY_21_TIN }}
          COMPANY_21_PASSWORD: ${{ secrets.COMPANY_21_PASSWORD }}
          COMPANY_22_TIN: ${{ secrets.COMPANY_22_TIN }}
          COMPANY_22_PASSWORD: ${{ secrets.COMPANY_22_PASSWORD }}
          COMPANY_23_TIN: ${{ secrets.COMPANY_23_TIN }}
          COMPANY_23_PASSWORD: ${{ secrets.COMPANY_23_PASSWORD }}
          COMPANY_24_TIN: ${{ secrets.COMPANY_24_TIN }}
          COMPANY_24_PASSWORD: ${{ secrets.COMPANY_24_PASSWORD }}

      - name: Check generated data
        run: |
          echo "========================================"
          echo "CHECKING GENERATED DATA"
          echo "========================================"

          test -f public/data.json

          node - <<'NODE'
          const fs = require("node:fs");
          const path = "public/data.json";

          if (!fs.existsSync(path)) {
            console.error(`Missing generated file: ${path}`);
            process.exit(1);
          }

          let payload;
          try {
            payload = JSON.parse(fs.readFileSync(path, "utf8"));
          } catch (error) {
            console.error("Generated data is not valid JSON:", error.message);
            process.exit(1);
          }

          if (!payload || typeof payload !== "object") {
            console.error("Generated data must be a JSON object.");
            process.exit(1);
          }

          if (typeof payload.updatedAt !== "string" || !payload.updatedAt) {
            console.error("Generated data is missing updatedAt.");
            process.exit(1);
          }

          if (!Array.isArray(payload.companies) || !Array.isArray(payload.applications)) {
            console.error("Generated data is missing companies or applications arrays.");
            process.exit(1);
          }

          if (typeof payload.totalCompanies !== "number" || typeof payload.totalApplications !== "number") {
            console.error("Generated data is missing totalCompanies or totalApplications.");
            process.exit(1);
          }

          if (payload.totalCompanies !== payload.companies.length) {
            console.error("Generated data totalCompanies does not match companies length.");
            process.exit(1);
          }

          if (payload.totalApplications !== payload.applications.length) {
            console.error("Generated data totalApplications does not match applications length.");
            process.exit(1);
          }

          console.log(`Validated generated data: ${payload.totalCompanies} companies, ${payload.totalApplications} applications`);
          NODE

          echo ""
          echo "data.json exists and parsed successfully."
          wc -c public/data.json

      - name: Save latest application data
        run: |
          echo "========================================"
          echo "SAVING APPLICATION DATA"
          echo "========================================"

          git config user.name "NAPAMS Monitor"
          git config user.email "actions@github.com"

          git add public/data.json

          if git diff --cached --quiet; then
            echo "No application data changes."
          else
            git commit -m "Update NAPAMS application status"
            git push
          fi
